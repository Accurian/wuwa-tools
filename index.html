<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Community calculators for Wuthering Waves Echo planning — all client-side, no data leaves your browser."
    />
    <meta name="theme-color" content="#0c0e13" />
    <title>Accu&rsquo;s WuWa Tools</title>
    <style>
      html {
        background-color: #12141a;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background-color: #f1eee7;
        color-scheme: light;
      }
      body {
        margin: 0;
        background-color: inherit;
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid any flash of the wrong theme.
      (function () {
        try {
          var key = 'wuwa:theme'
          var saved = localStorage.getItem(key)
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#fbfaf7' : '#0c0e13')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
